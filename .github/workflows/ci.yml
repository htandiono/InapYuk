name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest

    env:
      # Build-time placeholders. No real database is contacted; Prisma only
      # needs a syntactically valid URL to generate the client.
      DATABASE_URL: postgresql://user:password@localhost:5432/inapyuk
      DIRECT_URL: postgresql://user:password@localhost:5432/inapyuk
      JWT_ACCESS_SECRET: ci-access-secret-placeholder
      JWT_REFRESH_SECRET: ci-refresh-secret-placeholder
      CRON_SECRET: ci-cron-secret
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test:
    name: API and web tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eventure
          POSTGRES_PASSWORD: eventure_dev_only
          POSTGRES_DB: inapyuk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventure -d inapyuk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://eventure:eventure_dev_only@localhost:5432/inapyuk_test?schema=public
      DIRECT_URL: postgresql://eventure:eventure_dev_only@localhost:5432/inapyuk_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Test
        run: npm test
